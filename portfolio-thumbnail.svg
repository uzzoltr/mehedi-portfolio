<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">মেহেদীর প্রজেক্ট পোর্টফোলিও</title>
  <desc id="description">নিজের হাতে তৈরি ওয়েব প্রজেক্টের পোর্টফোলিও প্রচ্ছদ</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c32"/>
      <stop offset="0.62" stop-color="#1b3150"/>
      <stop offset="1" stop-color="#173f4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57c4a9"/>
      <stop offset="1" stop-color="#0f8b78"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071426" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1045" cy="85" r="210" fill="#57c4a9" opacity=".11"/>
  <circle cx="1080" cy="570" r="270" fill="#57c4a9" opacity=".08"/>
  <path d="M0 530c180-95 310-70 455 4s305 71 465-7 230-75 280-54v157H0z" fill="#0b172a" opacity=".28"/>

